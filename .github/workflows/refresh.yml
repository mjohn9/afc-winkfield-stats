name: Refresh dashboard data

on:
  schedule:
    - cron: "17 * * * *"   # every hour at 17 minutes past
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data.json from Baserow
        run: python build_data.py
        env:
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
          TABLE_APPEARANCES: ${{ vars.TABLE_APPEARANCES }}
          TABLE_SEASON_STATS: ${{ vars.TABLE_SEASON_STATS }}
          TABLE_MATCHES: ${{ vars.TABLE_MATCHES }}
          TABLE_TEAMS: ${{ vars.TABLE_TEAMS }}
          TABLE_AWARDS: ${{ vars.TABLE_AWARDS }}
          SHEET_APPEARANCES_URL: ${{ secrets.SHEET_APPEARANCES_URL }}
          SHEET_STATS_URL: ${{ secrets.SHEET_STATS_URL }}
          SHEET_MATCHES_URL: ${{ secrets.SHEET_MATCHES_URL }}
      - name: Commit changes
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data.json club.json managers.json teams.json awards.json
          git diff --staged --quiet || (git commit -m "Refresh data" && git push)
