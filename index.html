<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFC Winkfield Player Stats</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Search any AFC Winkfield player: appearances, goals, assists, awards and records.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AFC Winkfield">
<meta property="og:title" content="AFC Winkfield Player Stats">
<meta property="og:description" content="Search any AFC Winkfield player: appearances, goals, assists, awards and records.">
<meta property="og:image" content="https://www.afcwinkfield.com/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.afcwinkfield.com/share.png">
<link rel="icon" href="badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0D0E;--card:#17171A;--line:#2A2A2E;--text:#F2EEE6;--muted:#A39D90;--gold:#D1A04A;--lightgold:#F0D08C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;padding:32px 48px 48px;display:flex;justify-content:center}
@media(max-width:700px){body{padding:20px 20px 40px}}
button,input,select{font-family:inherit;color:inherit}
.wrap{width:100%;max-width:1280px;display:flex;flex-direction:column;gap:20px}
.cond{font-family:'Barlow Condensed',sans-serif}
.lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;flex:1 1 380px;min-width:0}
.card h2{margin:0 0 16px;font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.sub{font-size:13px;color:var(--muted);margin:-12px 0 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px}
.brand img{height:84px;width:auto;display:block}
@media(max-width:700px){.brand img{height:60px}}
h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
@media(max-width:700px){h1{font-size:26px}}
.pickers{display:flex;gap:12px;flex-wrap:wrap}
.pick{display:flex;flex-direction:column;justify-content:center;min-height:64px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 18px;position:relative}
.pick.main{border-color:var(--gold);width:300px}
.pick.small{width:200px}
@media(max-width:700px){.pickers{width:100%}.pick.main{flex:2 1 220px;width:auto}.pick.small{flex:1 1 130px;width:auto}}
.pick input,.pick select{background:transparent;border:0;outline:0;font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:600;padding:0;width:100%;appearance:none;-webkit-appearance:none}
.pick select{cursor:pointer}
.pick select option{background:var(--card);color:var(--text);font-size:16px}
.pick:focus-within{box-shadow:0 0 0 2px rgba(209,160,74,.45)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a{padding:10px 18px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-weight:600;font-size:15px;color:var(--muted)}
.nav a.on{border-color:var(--gold);color:var(--gold)}
.pick .caret{position:absolute;right:16px;bottom:18px;pointer-events:none}
.hero{display:flex;flex-direction:column;justify-content:space-between;gap:16px;flex:1 1 340px}
.big{font-family:'Barlow Condensed',sans-serif;font-size:132px;font-weight:700;line-height:.95;color:var(--gold)}
@media(max-width:700px){.big{font-size:96px}}
.rank{display:flex;align-items:baseline;gap:12px}
.rank b{font-family:'Barlow Condensed',sans-serif;font-size:44px;font-weight:600;line-height:1}
.stats{flex:2 1 560px;padding-top:8px;padding-bottom:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.grid3+.grid3{border-top:1px solid var(--line)}
.stat{padding:28px 0 28px 24px;border-right:1px solid var(--line)}
.stat:first-child{padding-left:0}
.stat:last-child{border-right:0}
.stat .v{display:flex;align-items:center;gap:10px;font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:600;line-height:1}
@media(max-width:700px){.stat{padding:16px 0 16px 14px}.stat .v{font-size:40px}}
.sw{width:14px;height:20px;border-radius:3px;display:block}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px}
.bar div{min-width:0}
.wdl{display:flex;gap:16px;margin-top:20px}
.wdl>div{flex:1;min-width:0}
.wdl .v{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:600;line-height:1;margin-top:8px}
.wdl .g{font-size:14px;color:var(--muted);margin-top:2px}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin-top:20px}
.legend div{display:flex;align-items:center;gap:10px;font-size:15px}
.legend div{min-width:0}
.legend span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:700px){.card{padding:20px}.legend{gap:12px 14px;grid-template-columns:1fr}}
.legend b{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600}
.rows{display:flex;flex-direction:column;gap:14px}
.rows .t{display:flex;justify-content:space-between;gap:12px;font-size:16px;margin-bottom:6px}
.rows .t b{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600}
.track{height:6px;background:#26262A;border-radius:3px}
.track i{display:block;height:6px;background:var(--gold);border-radius:3px}
.opp{display:flex;align-items:center;gap:14px;min-height:44px;border-top:1px solid var(--line)}
.opp .r{width:28px;font-family:'Barlow Condensed',sans-serif;font-size:18px;color:var(--muted)}
.opp .nm{flex:1;min-width:0}
.opp b{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600}
.h2h{display:flex;align-items:center;min-height:56px;border-top:1px solid var(--line)}
.h2h .a,.h2h .b{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:600}
.h2h .b{text-align:right}
.h2h .l{flex:1;text-align:center}
.win{color:var(--gold)}
.dim{color:#6B6558}
.cmp{display:flex;gap:10px;margin-bottom:8px}
.cmp>*{flex:1;min-width:0}
.cmp .me{display:flex;align-items:center;padding:0 14px;min-height:48px;border-radius:12px;background:var(--bg);border:1px solid var(--gold);font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600}
.cmp input{min-height:48px;padding:0 14px;border-radius:12px;background:var(--bg);border:1px dashed #6B6558;font-size:15px;outline:0}
.cmp input:focus{border-color:var(--gold)}
.empty{color:var(--muted);padding:12px 0}
footer{text-align:center;font-size:13px;color:var(--muted);padding-top:8px}
#err{padding:40px;text-align:center;color:var(--muted)}
.dn{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.dn .legend{margin-top:0;grid-template-columns:1fr;flex:1 1 140px}
.sharebtn{cursor:pointer;text-align:left;border-color:var(--gold);background:linear-gradient(180deg,#1f1b13,var(--card))}
.sharebtn:hover{background:#26200f}
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.88);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.ovb{max-width:460px;width:100%;display:flex;flex-direction:column;gap:14px;margin:auto}
.ovb img{width:100%;border-radius:14px;display:block;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.ovr{display:flex;gap:10px;flex-wrap:wrap}
.gbtn{flex:1 1 120px;min-height:48px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:#1D1408;font-weight:700;font-size:16px;cursor:pointer;text-align:center;line-height:46px;text-decoration:none;padding:0 14px}
.gbtn.alt{background:transparent;color:var(--gold)}
.ovn{font-size:13px;color:var(--muted);text-align:center}
/* achievements cabinet */
.ac-frame{padding:14px;border-radius:14px;background:linear-gradient(135deg,#7A5030,#3B2412 45%,#6B4423);box-shadow:0 24px 40px rgba(0,0,0,.65),inset 0 0 0 2px #8A5F33,inset 0 0 0 5px #2A190B}
.ac-crown{width:max-content;max-width:100%;margin:0 auto 12px;padding:6px 26px;border-radius:4px;background:linear-gradient(180deg,#E8C777,#A57A2E);color:#1D1408;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.ac-back{position:relative;overflow:hidden;border-radius:6px;padding:18px 0 0;background:radial-gradient(ellipse at 50% 0%,rgba(255,214,140,.22),rgba(255,214,140,0) 62%),linear-gradient(180deg,#1E1610,#0B0807);box-shadow:inset 0 0 50px #000,inset 0 0 0 1px #4A3719}
.ac-glass{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 62%,rgba(255,255,255,.05) 100%)}
.lab.ac-sl{color:#C9A15A;margin:0 0 4px 16px}
.ac-row{display:flex;flex-wrap:wrap;align-items:flex-start;margin-bottom:26px}
.ac-it{width:150px;display:flex;flex-direction:column;align-items:center}
.ac-glow{width:120px;height:112px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,206,120,.3),rgba(255,206,120,0) 68%)}
.ac-plinth{width:86px;height:10px;margin-top:-2px;border-radius:2px;background:linear-gradient(180deg,#5A3D1A,#2A190B)}
.ac-pl{width:100%;height:14px;background:linear-gradient(180deg,#B88A47,#6B4A22 55%,#3B2412);border-top:1px solid #D9B36A;box-shadow:0 10px 16px rgba(0,0,0,.6)}
.ac-fill{flex:1 1 0;min-width:0}
.ac-plq{width:128px;margin:14px 0 0;padding:6px 5px;border-radius:3px;text-align:center;background:linear-gradient(180deg,#E8C777,#A57A2E);color:#1D1408;font-family:'Barlow Condensed',sans-serif;line-height:1.15;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.ac-p1{font-size:15px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.ac-p2{font-size:13px;font-weight:600}
.ac-p3{font-size:12px;font-weight:500;opacity:.85}
@media(max-width:700px){.ac-crown{font-size:15px;letter-spacing:.12em;padding:6px 14px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="acg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0D08C"/><stop offset="1" stop-color="#B07F2E"/></linearGradient>
<symbol id="ac-cup" viewBox="0 0 64 72"><path d="M16 6h32v20c0 10-7 18-16 18S16 36 16 26z" fill="url(#acg)"/><path d="M16 12H7c0 12 5 20 12 22M48 12h9c0 12-5 20-12 22" fill="none" stroke="#D1A04A" stroke-width="4" stroke-linecap="round"/><rect x="28" y="42" width="8" height="14" fill="#D1A04A"/><path d="M18 58h28l3 10H15z" fill="url(#acg)"/></symbol>
<symbol id="ac-bowl" viewBox="0 0 64 72"><path d="M8 18h48c0 16-10 26-24 26S8 34 8 18z" fill="url(#acg)"/><path d="M8 22H3c0 8 4 12 9 13M56 22h5c0 8-4 12-9 13" fill="none" stroke="#D1A04A" stroke-width="3.5" stroke-linecap="round"/><rect x="29" y="44" width="6" height="12" fill="#D1A04A"/><path d="M20 58h24l3 10H17z" fill="url(#acg)"/></symbol>
<symbol id="ac-medal" viewBox="0 0 64 72"><path d="M20 4h10l6 22H26zM34 4h10L38 26H28z" fill="#C8383D"/><circle cx="32" cy="46" r="20" fill="url(#acg)"/><circle cx="32" cy="46" r="13" fill="none" stroke="#7A5A22" stroke-width="2"/><path d="M32 36l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z" fill="#7A5A22"/></symbol>
<symbol id="ac-shield" viewBox="0 0 64 72"><path d="M10 8h44v28c0 14-11 24-22 30C21 60 10 50 10 36z" fill="url(#acg)"/><path d="M32 20l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z" fill="#7A5A22"/></symbol>
</defs></svg>
<div class="wrap" id="app"><div id="err">Loading stats…</div></div>
<script src="config.js"></script>
<script>
const TEAMS=[["First Team","Firsts","#F0D08C",""],["Reserve Team","Reserves","#8F6A2A",""],["Sunday Team","Sundays","#D1A04A",""],["Development Team","Development","#B8B2A4",""],["Old Boys","Old Boys","#7A7A7A",""]];
const CARET='<svg class="caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D1A04A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
let D, names, S={p:null,s:"all",c:""};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ord=n=>{const v=n%100;return n+((v>10&&v<14)?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th"))};
const ZERO={a:0,g:0,as:0,y:0,r:0,cs:0,w:0,d:0,l:0,t:{},tm:[],mg:[],op:[],no:0,rk:0};
const blk=(p,s)=>(D.players[p]&&D.players[p][s])||ZERO;
const pct=(n,d,dp=0)=>d?(n/d*100).toFixed(dp):"0";

fetch("data.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  D=d;names=Object.keys(d.players);
  const q=new URLSearchParams(location.search);
  S.p=names.includes(q.get("p"))?q.get("p"):"";
  S.s=(q.get("s")==="all"||d.seasons.includes(q.get("s")))?q.get("s"):"all";
  S.c=names.includes(q.get("c"))?q.get("c"):"";
  if(q.get("p")&&names.includes(q.get("p")))track("player/"+S.p,"Player: "+S.p);
  render();
}).catch(()=>{document.getElementById("err").textContent="Stats could not be loaded. Try again shortly."});

function bars(list){
  if(!list.length)return '<div class="empty">No data for this selection.</div>';
  const mx=list[0][1];
  return '<div class="rows">'+list.map(([n,v])=>`<div><div class="t"><span>${esc(n)}</span><b>${v}</b></div><div class="track"><i style="width:${(v/mx*100).toFixed(1)}%"></i></div></div>`).join("")+"</div>";
}
function stat(v,l,sw){return `<div class="stat"><div class="v">${sw?`<span class="sw" style="background:${sw}"></span>`:""}${v}</div><div class="lab" style="margin-top:6px">${l}</div></div>`}

function render(){
  const b=blk(S.p,S.s), cb=S.c?blk(S.c,S.s):null;
  const seasonLabel=S.s==="all"?"All time":S.s;
  const ga=b.a?((b.g+b.as)/b.a).toFixed(2):"0.00";
  const tTotal=Object.values(b.t).reduce((x,y)=>x+y,0);
  const teamRows=TEAMS.map(([k,l,c,x])=>({l,c,x,n:b.t[k]||0}));
  const seasons=D.seasons.slice().reverse();
  const cmpRow=(l,f,fmt=v=>v)=>{
    const x=f(b),y=cb?f(cb):null;
    const cl=cb?(x>y?"a win":(y>x?"a":"a")):"a", cr=cb?(y>x?"b win":"b"):"b dim";
    return `<div class="h2h"><span class="${cl}">${fmt(x)}</span><span class="l lab">${l}</span><span class="${cr}">${cb?fmt(y):"–"}</span></div>`;
  };
  document.getElementById("app").innerHTML=`
  <header>
    <div class="brand"><img src="badge.png" alt="AFC Winkfield badge"><div><div class="lab cond" style="font-size:14px;letter-spacing:.16em">AFC Winkfield</div><h1>Player Stats</h1></div></div>
    <div class="pickers">
      <label class="pick main"><span class="lab">Player (tap to search)</span><input id="pl" list="plist" value="${esc(S.p)}" placeholder="Type a name" autocomplete="off" aria-label="Player">${CARET}<datalist id="plist">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist></label>
      <label class="pick small"><span class="lab">Season</span><select id="se" aria-label="Season"><option value="all"${S.s==="all"?" selected":""}>All time</option>${seasons.map(s=>`<option${S.s===s?" selected":""}>${s}</option>`).join("")}</select>${CARET.replace('stroke="#D1A04A"','stroke="#A39D90"')}</label>
    </div>
  </header>
  <nav class="nav"><a href="index.html" class="on">Players</a><a href="club.html">Club</a><a href="managers.html">Managers</a><a href="trophies.html">Trophies</a><a href="about.html">About</a></nav>
  ${!S.p?'<div class="card empty" style="flex:none;text-align:center;padding:48px 24px;font-size:18px">Search for a player above to see their stats.</div>':`${b.a?"":`<div class="card empty">${esc(S.p)} has no appearances in ${esc(seasonLabel)}.</div>`}
  <div class="row">
    <section class="card hero"><div><div class="lab">Total appearances</div><div class="big">${b.a}</div></div>
      <div class="rank"><b>${b.rk?ord(b.rk):"–"}</b><span class="lab">${S.s==="all"?"All-time appearance rank":"Appearance rank, "+esc(S.s)}</span></div></section>
    <section class="card stats"><div class="grid3">${stat(b.g,"Goals")}${stat(b.as,"Assists")}${stat(ga,"G/A per game")}</div>
      <div class="grid3">${stat(b.cs,"Clean sheets")}${stat(b.y,"Yellow cards","#F2C94C")}${stat(b.r,"Red cards","#E5484D")}</div></section>
  </div>
  <div class="row">
    <section class="card"><h2>Results</h2>
      <div class="bar"><div style="flex:${b.w} 1 0;background:#F0D08C"></div><div style="flex:${b.d} 1 0;background:#8A8578"></div><div style="flex:${b.l} 1 0;background:#C8383D"></div></div>
      <div class="wdl">
        <div><div class="lab"><span class="dot" style="background:#F0D08C"></span>Won</div><div class="v">${pct(b.w,b.a)}%</div><div class="g">${b.w} games</div></div>
        <div><div class="lab"><span class="dot" style="background:#8A8578"></span>Drawn</div><div class="v">${pct(b.d,b.a)}%</div><div class="g">${b.d} games</div></div>
        <div><div class="lab"><span class="dot" style="background:#C8383D"></span>Lost</div><div class="v">${pct(b.l,b.a)}%</div><div class="g">${b.l} games</div></div>
      </div></section>
    <section class="card"><h2>Appearances by team</h2>
      <div class="dn">${donut(teamRows.map(t=>[t.n,t.c]),170,24,tTotal,"games")}<div class="legend">${teamRows.map(t=>`<div><span class="dot" style="background:${t.c};margin:0;flex:none"></span><span class="n">${t.l}</span><b>${pct(t.n,tTotal,1)}%</b></div>`).join("")}</div></div></section>
    <section class="card"><h2>Head to head</h2>
      <div class="cmp"><div class="me">${esc(S.p)}</div><input id="cp" list="plist" value="${esc(S.c)}" placeholder="Choose player" autocomplete="off" aria-label="Compare with"></div>
      ${cmpRow("Appearances",x=>x.a)}${cmpRow("Goals",x=>x.g)}${cmpRow("Assists",x=>x.as)}${cmpRow("Clean sheets",x=>x.cs)}${cmpRow("Win rate",x=>x.a?x.w/x.a:0,v=>(v*100).toFixed(0)+"%")}</section>
  </div>
  <div class="row">
    <section class="card"><h2>Top teammates</h2><div class="sub">Games played together</div>${bars(b.tm)}</section>
    <section class="card"><h2>Top managers</h2><div class="sub">Appearances under each manager</div>${bars(b.mg)}</section>
    <section class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><h2 style="margin-bottom:4px">Most played opponents</h2><span class="sub" style="margin:0">${b.no} faced</span></div><div class="sub" style="margin:0 0 8px">Games played against each side</div>
      ${b.op.length?b.op.map(([n,v],i)=>`<div class="opp"><span class="r">${i+1}</span><span class="nm">${esc(n)}</span><b>${v}</b></div>`).join(""):'<div class="empty">No data for this selection.</div>'}</section>
  </div>
  `}
  ${S.p?'<div id="ach"></div>':''}
  ${S.p?`<section class="card" style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap"><div><h2 style="margin-bottom:4px">Share your stats</h2><div class="sub" style="margin:0">Make a picture of these stats for WhatsApp, Instagram or Facebook.</div></div><button type="button" class="gbtn" id="sharebtn" style="flex:0 0 auto;min-width:220px">Make my card</button></section>`:""}
  ${socialLinks()}
  <footer>AFC Winkfield FC · Updated ${esc(D.updated||"")}${GC_CODE?"<br>Visits and player searches are counted anonymously. No cookies.":""}</footer>`;

  const pl=document.getElementById("pl"), cp=document.getElementById("cp");
  const bind=(el,key,keep)=>{
    el.addEventListener("focus",()=>{el.dataset.prev=el.value;el.value=""});
    el.addEventListener("change",()=>{if(names.includes(el.value)){S[key]=el.value;track(key==="p"?"player/"+el.value:"compare/"+S.p+" vs "+el.value,(key==="p"?"Player: ":"Compare: ")+el.value);go()}});
    el.addEventListener("blur",()=>{if(!names.includes(el.value)){el.value=(key==="c"&&el.value==="")?"":el.dataset.prev||keep()}});
  };
  bind(pl,"p",()=>S.p); if(cp){bind(cp,"c",()=>S.c); cp.addEventListener("input",()=>{if(cp.value===""&&S.c){S.c="";}});}
  document.getElementById("se").addEventListener("change",e=>{S.s=e.target.value;track("season/"+S.s,"Season: "+S.s);go()});
  const sb=document.getElementById("sharebtn");if(sb)sb.addEventListener("click",shareCard);
  if(S.p)loadExtra().then(drawAch);
}
function donut(parts,size,th,big,small){
  const r=(size-th)/2,cx=size/2,circ=2*Math.PI*r,tot=parts.reduce((a,p)=>a+p[0],0)||1;let off=0,out="";
  for(const [v,c] of parts){if(v<=0)continue;const L=v/tot*circ;out+=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${c}" stroke-width="${th}" stroke-dasharray="${Math.max(0,L-2).toFixed(1)} ${(circ-L+2).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 ${cx} ${cx})"/>`;off+=L}
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="flex:none"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#26262A" stroke-width="${th}"/>${out}<text x="${cx}" y="${cx+4}" text-anchor="middle" fill="#F2EEE6" style="font-family:'Barlow Condensed',sans-serif;font-size:${Math.round(size*.26)}px;font-weight:700">${big}</text><text x="${cx}" y="${cx+size*.15}" text-anchor="middle" fill="#A39D90" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600">${small}</text></svg>`;
}

/* ---------- share card ---------- */
let EXTRA=null;
async function loadExtra(){
  if(EXTRA)return EXTRA;
  const j=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  const [T,A]=await Promise.all([j("teams.json"),j("awards.json")]);
  return EXTRA={T,A};
}
const ACH_ICON={"Player's Player of the Season":"medal","Team Player of the Season":"medal","Manager's Player of the Season":"medal","Top Goalscorer":"cup","Top Assists":"cup"};
const ACH_TEAM={"First Team":"Firsts","Reserve Team":"Reserves","Sunday Team":"Sundays","Development Team":"Development","Old Boys":"Old Boys","Club":"Club"};
const acIdx=k=>{const i=TEAMS.findIndex(t=>t[0]===k);return i<0?99:i};
function acItem(icon,l1,l2,l3){
  return `<div class="ac-it"><div class="ac-glow"><svg width="84" height="94" viewBox="0 0 64 72" aria-hidden="true"><use href="#ac-${icon}"/></svg></div><div class="ac-plinth"></div><div class="ac-pl"></div><div class="ac-plq"><div class="ac-p1">${l1}</div><div class="ac-p2">${l2}</div>${l3?`<div class="ac-p3">${l3}</div>`:""}</div></div>`;
}
function acShelf(label,items){
  return `<div class="lab ac-sl">${label}</div><div class="ac-row">${items.join("")}<div class="ac-fill"><div style="height:120px"></div><div class="ac-pl"></div></div></div>`;
}
// Team honours and personal awards for the chosen player and season. Empty means no section.
function drawAch(){
  const el=document.getElementById("ach");if(!el||!S.p||!EXTRA)return;
  const {T,A}=EXTRA,p=D.players[S.p];
  const seasons=(S.s==="all"?D.seasons.slice():[S.s]).sort().reverse();
  const team=[];
  if(T&&p){
    for(const s of seasons){
      const sb=p[s];if(!sb)continue;
      const rows=Object.entries(sb.t||{}).filter(([,n])=>n>=5)
        .map(([tm])=>T.rows.find(x=>x.season===s&&x.team===tm)).filter(Boolean)
        .sort((a,b)=>acIdx(a.team)-acIdx(b.team));
      for(const r of rows){
        const who=`${ACH_TEAM[r.team]||esc(r.team)} · ${s}`;
        if(r.pos===1)team.push(acItem("cup",who,"League champions",esc(r.div||"")));
        for(const [k,n] of T.cups){if(r.cups[k]==="Winners")team.push(acItem("bowl",who,`${esc(n)} winners`,""))}
        if(r.promoted===true)team.push(acItem("medal",who,"Promoted",esc([r.pos?ord(r.pos):"",r.div].filter(Boolean).join(" · "))));
      }
    }
  }
  const fun=(typeof SHOW_FUN_AWARDS==="undefined")?true:SHOW_FUN_AWARDS;
  const aw=A?A.rows.filter(r=>r[3]===S.p&&(S.s==="all"||r[0]===S.s)&&(fun||r[2]!=="Cock-up of the Season"))
    .sort((a,b)=>a[0]<b[0]?1:a[0]>b[0]?-1:acIdx(a[1])-acIdx(b[1])):[];
  const personal=aw.map(r=>acItem(ACH_ICON[r[2]]||"shield",`${ACH_TEAM[r[1]]||esc(r[1])} · ${esc(r[0])}`,esc(r[2]),""));
  if(!team.length&&!personal.length){el.innerHTML="";return}
  const shelves=[];
  if(team.length)shelves.push(acShelf(`Team honours · ${team.length}`,team));
  if(personal.length)shelves.push(acShelf(`Personal awards · ${personal.length}`,personal));
  el.innerHTML=`<div class="ac-frame"><div class="ac-crown">Achievements · ${S.s==="all"?"All time":esc(S.s)}</div><div class="ac-back">${shelves.join("")}<div class="ac-glass"></div></div></div>
    ${team.length?'<div class="sub" style="margin:10px 4px 0">Team honours count where the player made 5 or more appearances for that team in the season.</div>':""}`;
}
function cardFacts(){
  const b=blk(S.p,S.s),{T,A}=EXTRA;let promos=0,titles=0,cups=0;
  if(T){
    for(const s of (S.s==="all"?D.seasons:[S.s])){
      const sb=D.players[S.p]&&D.players[S.p][s];if(!sb)continue;
      for(const [team,n] of Object.entries(sb.t||{})){
        if(n<5)continue;const r=T.rows.find(x=>x.season===s&&x.team===team);if(!r)continue;
        if(r.promoted===true)promos++;if(r.pos===1)titles++;cups+=T.cups.filter(([k])=>r.cups[k]==="Winners").length;
      }
    }
  }
  const fun=(typeof SHOW_FUN_AWARDS==="undefined")?true:SHOW_FUN_AWARDS;
  const awards=A?A.rows.filter(r=>r[3]===S.p&&(S.s==="all"||r[0]===S.s)&&(fun||r[2]!=="Cock-up of the Season")).length:0;
  return {b,promos,titles,cups,awards};
}
const rr=(x,a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
async function drawCard(){
  await loadExtra();
  const f=cardFacts(),b=f.b,W=1080,H=1350,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  try{await Promise.all([document.fonts.load('700 100px "Barlow Condensed"'),document.fonts.load('600 40px "Barlow"')])}catch(e){}
  const CF='"Barlow Condensed","Arial Narrow",sans-serif',BF='"Barlow",Arial,sans-serif';
  const txt=(t,px,py,font,color,al="left")=>{x.font=font;x.fillStyle=color;x.textAlign=al;x.fillText(t,px,py)};
  x.fillStyle="#0D0D0E";x.fillRect(0,0,W,H);
  let g=x.createRadialGradient(W/2,0,40,W/2,0,950);g.addColorStop(0,"rgba(209,160,74,.30)");g.addColorStop(1,"rgba(209,160,74,0)");x.fillStyle=g;x.fillRect(0,0,W,H);
  rr(x,28,28,W-56,H-56,34);x.strokeStyle="#D1A04A";x.lineWidth=3;x.stroke();
  const img=await new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src="badge.png"});
  if(img)x.drawImage(img,72,66,img.width/img.height*150,150);
  txt("AFC WINKFIELD",268,118,`600 32px ${BF}`,"#A39D90");txt("PLAYER CARD",268,184,`700 66px ${CF}`,"#F2EEE6");
  x.fillStyle="rgba(209,160,74,.45)";x.fillRect(72,248,W-144,2);
  let fs=170;x.font=`700 ${fs}px ${CF}`;const nm=S.p.toUpperCase();while(x.measureText(nm).width>W-160&&fs>60){fs-=4;x.font=`700 ${fs}px ${CF}`}
  txt(nm,80,258+fs*.92,`700 ${fs}px ${CF}`,"#F2EEE6");
  const scope=S.s==="all"?"ALL TIME":"SEASON "+S.s;txt(scope,84,258+fs*.92+56,`600 46px ${CF}`,"#D1A04A");
  const ty=470;
  txt(String(b.a),76,ty+210,`700 270px ${CF}`,"#D1A04A");txt("APPEARANCES",84,ty+262,`600 30px ${BF}`,"#A39D90");
  if(b.rk)txt(ord(b.rk)+(S.s==="all"?" all-time":" this season"),84,ty+322,`600 46px ${CF}`,"#F2EEE6");
  const cx=800,cy=ty+170,R=128,T2=36,tot=b.a||1;let a0=-Math.PI/2;
  x.lineWidth=T2;x.strokeStyle="#26262A";x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.stroke();
  for(const [v,c] of [[b.w,"#F0D08C"],[b.d,"#8A8578"],[b.l,"#C8383D"]]){if(!v)continue;const a1=a0+v/tot*Math.PI*2;x.strokeStyle=c;x.beginPath();x.arc(cx,cy,R,a0+.012,a1-.012);x.stroke();a0=a1}
  txt(Math.round(b.w/tot*100)+"%",cx,cy+22,`700 78px ${CF}`,"#F2EEE6","center");txt("WON",cx,cy+58,`600 26px ${BF}`,"#A39D90","center");
  txt(`W ${b.w}  ·  D ${b.d}  ·  L ${b.l}`,cx,cy+R+62,`600 28px ${BF}`,"#A39D90","center");
  const sy=ty+420;x.fillStyle="rgba(255,255,255,.12)";x.fillRect(386,sy-20,2,150);x.fillRect(692,sy-20,2,150);
  [[b.g,"GOALS",80],[b.as,"ASSISTS",412],[b.cs,"CLEAN SHEETS",718]].forEach(([v,l,px])=>{txt(String(v),px,sy+84,`700 112px ${CF}`,"#F2EEE6");txt(l,px+4,sy+126,`600 28px ${BF}`,"#A39D90")});
  const by=sy+190;txt("APPEARANCES BY TEAM",80,by,`600 26px ${BF}`,"#A39D90");
  const parts=TEAMS.map(([k,l,c])=>({l,c,n:(b.t||{})[k]||0})).filter(p=>p.n>0),bt=parts.reduce((a,p)=>a+p.n,0)||1;let bx=80;
  rr(x,80,by+16,920,26,13);x.save();x.clip();for(const p of parts){const w=p.n/bt*920;x.fillStyle=p.c;x.fillRect(bx,by+16,w,26);bx+=w}x.restore();
  let lx=80;for(const p of parts){x.fillStyle=p.c;x.fillRect(lx,by+66,22,22);x.font=`600 28px ${BF}`;const t=`${p.l} ${p.n}`;txt(t,lx+32,by+86,`600 28px ${BF}`,"#F2EEE6");lx+=32+x.measureText(t).width+34}
  const chips=[];if(f.awards)chips.push(f.awards+(f.awards===1?" award":" awards"));if(f.promos)chips.push(f.promos+(f.promos===1?" promotion":" promotions"));if(f.titles)chips.push(f.titles+(f.titles===1?" league title":" league titles"));if(f.cups)chips.push(f.cups+(f.cups===1?" cup win":" cup wins"));
  let cx2=80;const cyy=by+118;
  for(const t of chips.slice(0,4)){x.font=`600 28px ${BF}`;const w=x.measureText(t).width+44;if(cx2+w>1000)break;rr(x,cx2,cyy,w,52,26);x.fillStyle="rgba(209,160,74,.14)";x.fill();x.strokeStyle="#D1A04A";x.lineWidth=2;x.stroke();txt(t,cx2+22,cyy+36,`600 28px ${BF}`,"#F0D08C");cx2+=w+14}
  const url=(location.host+location.pathname).replace(/\/[^\/]*$/,"/").replace(/^\//,"");
  txt(url,W/2,H-52,`500 26px ${BF}`,"#A39D90","center");
  return cv;
}
async function shareCard(){
  const btn=document.getElementById("sharebtn"),old=btn.textContent;btn.textContent="Making card…";
  try{
    track("share/"+S.p,"Share card: "+S.p);
    const cv=await drawCard();
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    showCard(blob);
  }catch(e){alert("Sorry, the card could not be made on this device.")}
  btn.textContent=old;
}
function showCard(blob){
  const url=URL.createObjectURL(blob),nm=(S.p+"-"+(S.s==="all"?"all-time":S.s.replace("/","-"))).replace(/[^a-z0-9-]+/gi,"-")+".png";
  const file=new File([blob],nm,{type:"image/png"}),can=navigator.canShare&&navigator.canShare({files:[file]});
  const o=document.createElement("div");o.className="ov";
  o.innerHTML=`<div class="ovb"><img src="${url}" alt="Stats card for ${esc(S.p)}"><div class="ovr">${can?'<button type="button" class="gbtn" id="ov-share">Share</button>':""}<a class="gbtn alt" download="${nm}" href="${url}">Save image</a><button type="button" class="gbtn alt" id="ov-close">Close</button></div>${can?"":'<div class="ovn">On a phone, press and hold the picture to save it, or use Save image.</div>'}</div>`;
  document.body.appendChild(o);
  const close=()=>{o.remove();URL.revokeObjectURL(url);document.removeEventListener("keydown",esc2)};
  const esc2=e=>{if(e.key==="Escape")close()};document.addEventListener("keydown",esc2);
  o.querySelector("#ov-close").addEventListener("click",close);o.addEventListener("click",e=>{if(e.target===o)close()});
  const sh=o.querySelector("#ov-share");if(sh)sh.addEventListener("click",async()=>{try{await navigator.share({files:[file],title:S.p+" · AFC Winkfield",text:"My AFC Winkfield stats"})}catch(e){}});
}

function go(){
  const q=new URLSearchParams();q.set("p",S.p);if(S.s!=="all")q.set("s",S.s);if(S.c)q.set("c",S.c);
  history.replaceState(null,"","?"+q.toString());render();
}
